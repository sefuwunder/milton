<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milton — exec-crm copilot</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
// Apply the stored theme before first paint (no flash). Absence = auto: CSS
// follows the OS prefers-color-scheme via :root:not([data-theme]).
try {
  var t = localStorage.getItem("milton_theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="avatar">M</div>
      <div>
        <div class="name">Milton</div>
        <div class="sub"><span id="status-dot" class="dot"></span><span id="status-text">connecting…</span></div>
      </div>
    </div>
    <div class="top-actions">
      <select id="session-select" class="ws-select session-select" title="Chat session"></select>
      <button id="session-new" class="ghost" title="New chat session" aria-label="New chat session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <select id="ws-select" class="ws-select" title="Workspace" hidden></select>
      <button id="bell-btn" class="ghost bell" title="Automation runs" aria-label="Automation runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><span id="bell-badge" class="badge" hidden></span></button>
      <button id="auto-btn" class="ghost" title="Automations" aria-label="Automations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.3 6.3l1.6 1.6M16.1 16.1l1.6 1.6M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6"/></svg></button>
      <button id="theme-btn" class="ghost" title="Theme: Auto (follows system)" aria-label="Theme: Auto (follows system)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
      <button id="help-btn" class="ghost" title="What can Milton do?">?</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <section id="auto-view" class="auto-view" hidden>
    <div class="auto-head">
      <nav class="tabs" id="auto-tabs">
        <button class="tab active" data-tab="routines">Routines</button>
        <button class="tab" data-tab="schedules">Schedules</button>
        <button class="tab" data-tab="triggers">Triggers</button>
        <button class="tab" data-tab="runs">Runs</button>
      </nav>
      <button id="auto-close" class="ghost auto-close" title="Close (Esc)" aria-label="Close automations panel">×</button>
    </div>
    <div id="auto-body" class="auto-body"></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <div id="chips" class="chips"></div>

  <div id="tray" class="tray" hidden></div>

  <form id="composer" class="composer" autocomplete="off">
    <div id="palette" class="palette" role="listbox" aria-label="Command palette" hidden></div>
    <button type="button" id="cam-btn" class="cam" aria-label="Attach a photo or contacts file" title="Attach a photo or contacts file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9.5A1.5 1.5 0 0 1 4 8z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button>
    <input id="photo-input" type="file" accept="image/*,.vcf" hidden>
    <button type="button" id="vcf-btn" class="cam" aria-label="Import contacts from a vCard file" title="Import contacts (.vcf)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M5.6 16.6c.6-1.9 1.9-2.9 3.4-2.9s2.8 1 3.4 2.9"/><path d="M15 9.5h4M15 12.5h2.5"/></svg></button>
    <input id="vcf-input" type="file" accept=".vcf" hidden>
    <input id="input" type="text" placeholder="Ask Milton… e.g. &quot;morning brief&quot; or &quot;move Acme deal to negotiation&quot;" maxlength="2000" aria-label="Message Milton">
    <button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10.5 13.5"/><path d="M21 3l-7 18-3.5-7.5L3 10l18-7z"/></svg></button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
