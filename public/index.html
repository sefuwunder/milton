<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milton — exec-crm copilot</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
// Apply the stored theme before first paint (no flash). Absence = auto: CSS
// follows the OS prefers-color-scheme via :root:not([data-theme]).
try {
  var t = localStorage.getItem("milton_theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="avatar">M</div>
      <div>
        <div class="name">Milton</div>
        <div class="sub"><span id="status-dot" class="dot"></span><span id="status-text">connecting…</span></div>
      </div>
    </div>
    <div class="top-actions">
      <select id="ws-select" class="ws-select" title="Workspace" hidden></select>
      <button id="bell-btn" class="ghost bell" title="Automation runs">🔔<span id="bell-badge" class="badge" hidden></span></button>
      <button id="auto-btn" class="ghost" title="Automations">⚙️</button>
      <button id="theme-btn" class="ghost" title="Theme: Auto (follows system)">🌓</button>
      <button id="help-btn" class="ghost" title="What can Milton do?">?</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <section id="auto-view" class="auto-view" hidden>
    <div class="auto-head">
      <nav class="tabs" id="auto-tabs">
        <button class="tab active" data-tab="routines">Routines</button>
        <button class="tab" data-tab="schedules">Schedules</button>
        <button class="tab" data-tab="triggers">Triggers</button>
        <button class="tab" data-tab="runs">Runs</button>
      </nav>
      <button id="auto-close" class="ghost auto-close" title="Close (Esc)" aria-label="Close automations panel">×</button>
    </div>
    <div id="auto-body" class="auto-body"></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <div id="chips" class="chips"></div>

  <div id="tray" class="tray" hidden></div>

  <form id="composer" class="composer" autocomplete="off">
    <button type="button" id="cam-btn" class="cam" aria-label="Take or upload a photo" title="Take or upload a photo">📷</button>
    <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
    <input id="input" type="text" placeholder="Ask Milton… e.g. &quot;morning brief&quot; or &quot;move Acme deal to negotiation&quot;" maxlength="2000" aria-label="Message Milton">
    <button type="submit" class="send" aria-label="Send">↑</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
